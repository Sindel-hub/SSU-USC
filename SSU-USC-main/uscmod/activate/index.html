<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Activate your SSU-USC account</title><link rel="stylesheet" href="../shared/needs-assessment.css"><script src="../shared/app-config.js"></script></head><body class="na-public"><header>SSU UNIVERSITY STUDENT COUNCIL</header><main class="na-workspace"><section class="na-panel"><h1>Activate your student account</h1><p>Choose a password to activate the student account issued by USC.</p><p id="activationMessage" role="status" class="na-status" aria-live="polite"></p><form id="activationForm"><label for="activationPassword">New password (12–128 characters)</label><input id="activationPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="activationConfirm">Confirm password</label><input id="activationConfirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="activationSubmit" class="primary" type="submit">Activate account</button></form><p id="activationDone" hidden><a href="../index/index.html">Continue to sign in</a></p></section></main><script type="module" src="activate.js"></script></body></html>
