<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Student Needs Assessment — SSU-USC</title>
    <link rel="stylesheet" href="../usc-admin/shared/css/usc-theme.css" />
    <link rel="stylesheet" href="../shared/management.css" />
    <script src="../shared/app-config.js"></script>
  </head>
  <body>
    <header class="management-header">
      <img
        src="../usc-admin/shared/assets/SSUlogo.webp"
        alt="Samar State University"
      /><img
        src="../usc-admin/shared/assets/USClogo.webp"
        alt="University Student Council"
      />
      <div>
        <strong>SSU UNIVERSITY STUDENT COUNCIL</strong
        ><small>Leadership · Excellence · Discipline · Service</small>
      </div>
    </header>
    <nav class="management-nav">
      <a href="/home/home.html">Bulletin Board</a>
    </nav>
    <main class="management-main">
      <h1>Needs Assessment</h1>
      <p class="lead">
        Share your needs, concerns, and ideas to help USC plan student services.
        Surveys are anonymous and do not require an account.
      </p>
      <p class="notice" id="listStatus" role="status">
        Loading available surveys…
      </p>
      <section
        id="availableSurveys"
        class="grid"
        aria-label="Available surveys"
      ></section>
    </main>
    <script type="module" src="list.js"></script>
  </body>
</html>
