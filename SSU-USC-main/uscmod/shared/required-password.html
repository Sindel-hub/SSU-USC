<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change temporary password · SSU USC</title><link rel="stylesheet" href="required-password.css?v=1"><script src="app-config.js"></script></head>
<body><main><div class="brand">SSU · UNIVERSITY STUDENT COUNCIL</div><h1>Choose your password</h1><p>Replace your temporary password to continue to the student dashboard.</p><form id="requiredPasswordForm"><label for="requiredPassword">New password</label><input id="requiredPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="64" aria-describedby="requiredPasswordRules passwordFeedback"><small id="requiredPasswordRules">10–64 characters with uppercase, lowercase, a number and a symbol.</small><label for="confirmRequiredPassword">Confirm password</label><input id="confirmRequiredPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="64" aria-describedby="passwordFeedback"><label class="show"><input id="showRequiredPassword" type="checkbox"> Show passwords</label><p id="passwordFeedback" role="status" aria-live="polite"></p><button id="saveRequiredPassword" type="submit" disabled>Save password</button></form><button class="secondary" id="leaveRequiredPassword" type="button">Sign out</button></main><script type="module" src="required-password.js?v=1"></script></body></html>
